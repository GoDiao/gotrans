name: Release macOS

# 打 tag（vX.Y.Z）即在 GitHub 托管的 Mac runner 上构建并打包，产出 ad-hoc 签名的
# .zip 与 .dmg，附到同名 GitHub Release。
#
# 免费分发方案：不导入 Developer ID 证书、不公证，因此本工作流不需要任何 Actions
# Secret。将来购买证书后要恢复签名与公证，见 Scripts/release.sh 顶部的说明。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: 选择包含 macOS 26 SDK 的正式 Xcode
        run: |
          set -euo pipefail
          SELECTED=""
          for APP in $(find /Applications -maxdepth 1 -name 'Xcode*.app' ! -iname '*beta*' -print | sort -r); do
            DEV="$APP/Contents/Developer"
            SDK_VERSION="$(DEVELOPER_DIR="$DEV" xcrun --sdk macosx --show-sdk-version 2>/dev/null || true)"
            SDK_MAJOR="${SDK_VERSION%%.*}"
            if [[ "$SDK_MAJOR" =~ ^[0-9]+$ ]] && [ "$SDK_MAJOR" -ge 26 ]; then
              SELECTED="$DEV"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "::error::Runner 没有包含 macOS 26 SDK 的正式版 Xcode，无法编译 Liquid Glass 兼容分支"
            exit 1
          fi
          echo "DEVELOPER_DIR=$SELECTED" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$SELECTED" xcodebuild -version
          DEVELOPER_DIR="$SELECTED" xcrun --sdk macosx --show-sdk-version

      - name: 安装构建工具
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v create-dmg >/dev/null || brew install create-dmg

      - name: 准备 Metal 工具链
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: 读取版本并校验 tag
        run: |
          set -euo pipefail
          VERSION=$(grep 'MARKETING_VERSION' App/project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::tag v$TAG 与 App/project.yml 的 MARKETING_VERSION $VERSION 不一致，请先对齐再打 tag"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 构建并打包（zip + dmg）
        run: ./Scripts/release.sh

      - name: 生成 Release 说明
        run: |
          set -euo pipefail
          ZIP_SHA="$(shasum -a 256 "dist/GoTrans-$VERSION.zip" | cut -d' ' -f1)"
          DMG_SHA="$(shasum -a 256 "dist/GoTrans-$VERSION.dmg" | cut -d' ' -f1)"
          cat > release-notes.md <<NOTES
          macOS 本地翻译。模型下载完成后，翻译的文本不会离开你的 Mac。

          需要 **Apple Silicon Mac** 与 **macOS 15 或更高版本**。

          ## 安装

          下载 \`GoTrans-$VERSION.dmg\`，打开后把 GoTrans 拖进「应用程序」。

          首次打开时系统会拦一下，因为本应用使用 ad-hoc 签名、未经 Apple 公证。到**系统设置 ›
          隐私与安全性**，下滑点一下「仍要打开」就行，只需要做这一次。

          也可以在终端执行：

          \`\`\`
          xattr -d com.apple.quarantine /Applications/GoTrans.app
          \`\`\`

          macOS 15 Sequoia 起已移除「按住 Control 点按 → 打开」这条旧路径，那个方法不再有效。

          ## 首次使用

          启动后不会自动下载任何模型。进入**设置 › 模型**，选一个下载，完成后点「使用」。
          最小的 Hy-MT2 1.25-bit 约 462 MB；通用文本处理需要 Gemma 4（3.6 GB 起）。

          然后即可使用：任意应用中选中文字按 \`⌥⌘T\`，或复制后按 \`⌥D\` 翻译剪贴板。

          ## 校验和（SHA-256）

          \`\`\`
          $DMG_SHA  GoTrans-$VERSION.dmg
          $ZIP_SHA  GoTrans-$VERSION.zip
          \`\`\`

          未经公证意味着没有 Apple 的背书，请自行核对校验和确认文件完整。

          ---

          GoTrans 衍生自 [GemmaTrans](https://github.com/Rand01ph/gemma-trans)（作者 Rand01ph，MIT 许可证），
          该项目已停止维护。详见 [README](https://github.com/GoDiao/gotrans#readme) 与
          [隐私政策](https://github.com/GoDiao/gotrans/blob/main/PRIVACY.md)。
          NOTES
          echo "--- 生成的说明 ---"
          cat release-notes.md

      - name: 留存手动验收产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GoTrans-${{ env.VERSION }}
          path: |
            dist/GoTrans-${{ env.VERSION }}.zip
            dist/GoTrans-${{ env.VERSION }}.dmg
          if-no-files-found: error

      - name: 创建 Release 并上传产物
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: GoTrans ${{ env.VERSION }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/GoTrans-${{ env.VERSION }}.zip
            dist/GoTrans-${{ env.VERSION }}.dmg
