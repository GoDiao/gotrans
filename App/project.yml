name: GoTrans
options:
  bundleIdPrefix: com.godiao
  deploymentTarget:
    macOS: '15.0'
packages:
  GoTransCore:
    path: ../
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  HunyuanModelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
    - ../Tests/GoTransKitTests/HunyuanPrefillTests.swift
    dependencies:
    - package: GoTransCore
      product: GoTransKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.godiao.GoTrans.tests.hunyuan
        SWIFT_VERSION: '6.0'
        ARCHS: arm64
  GoTrans:
    sources:
    - GoTrans
    - Composition
    info:
      path: GoTrans/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: GoTrans
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSServices:
        - NSMenuItem:
            default: Translate with GoTrans
          NSKeyEquivalent:
            default: ~@t
          NSMessage: translateSelection
          NSPortName: GoTrans
          NSRequiredContext: {}
          NSSendTypes:
          - NSStringPboardType
          - public.utf8-plain-text
    settings:
      base:
        ENABLE_APP_SANDBOX: false
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: '6.0'
        ARCHS: arm64
        # 全仓库唯一的版本号来源。发布工作流与 Scripts/release.sh 都 grep 这一行；
        # Info.plist 的 CFBundleShortVersionString 也从这里取值，不要再写字面值。
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "2"
      configs:
        Release:
          # ad-hoc 签名：免费分发，不公证。换成付费 Developer ID 证书时，把
          # CODE_SIGN_IDENTITY 改回 "Developer ID Application"，并加回
          # ENABLE_HARDENED_RUNTIME: true 与 OTHER_CODE_SIGN_FLAGS: --timestamp。
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    templates:
    - GoTransShared
schemes:
  HunyuanModelTests:
    build:
      targets:
        HunyuanModelTests: all
    test:
      targets:
      - HunyuanModelTests
      environmentVariables:
        GOTRANS_HYMT_PREFILL_TEST: '1'
include:
- shared-targets.yml
